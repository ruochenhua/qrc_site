<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>QRC-Eye production runtime fixture</title>
    <link rel="stylesheet" href="/assets/world/runtime/world.css">
  </head>
  <body>
    <main>
      <h1>生产场景测试页</h1>
      <p id="scene-status" role="status">正在载入场景</p>
      <div id="world-host" aria-hidden="true" data-world-debug="true"></div>
      <section aria-label="静态项目入口">
        <h2>全部项目</h2>
        <a href="/cybertravel/index.html" id="project-link">CyberTravel</a>
      </section>
    </main>
    <script type="module">
      const host = document.querySelector('#world-host');
      const status = document.querySelector('#scene-status');

      host.addEventListener('qrc-world:ready', (event) => {
        status.textContent = '生产场景已载入';
        host.dataset.worldReady = 'true';
        host.dataset.anchorCount = String(event.detail.anchorCount);
      });
      host.addEventListener('qrc-world:hover', (event) => {
        host.dataset.hoveredProject = event.detail.id ?? '';
      });
      host.addEventListener('qrc-world:select', (event) => {
        host.dataset.selectedProject = event.detail.id ?? '';
      });
      host.addEventListener('qrc-world:error', () => {
        status.textContent = '生产场景资源暂不可用，请使用下方项目入口';
      });

      import('/assets/world/runtime/world.js')
        .then(({ mountWorld }) => {
          mountWorld(host);
        })
        .catch(() => {
          status.textContent = '场景暂不可用，请使用下方项目入口';
          host.remove();
        });
    </script>
  </body>
</html>
